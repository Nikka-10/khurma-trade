<form method="POST">
    {% csrf_token %}
    <h2>Set new password</h2>
    {% if validlink %}
        {{ form }}
        <button type="submit">Set new password</button>
    {% else %}
        <p style="color:red">This link is invalid or has expired.</p>
        <a href="{% url 'users:password_reset' %}">Request a new one</a>
    {% endif %}
</form>
