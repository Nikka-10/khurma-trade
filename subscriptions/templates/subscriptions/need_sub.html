{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Required</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .con {
            width: 100%;
            max-width: 460px;
            padding: 40px;
            text-align: center;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #eef2ff;
            font-size: 28px;
        }

        h1 {
            margin-bottom: 12px;
            font-size: 24px;
            font-weight: 600;
        }

        .need-permission {
            margin-bottom: 28px;
            color: #6b7280;
            font-size: 15px;
            line-height: 1.6;
        }

        .tier {
            font-weight: 600;
            color: #4f46e5;
            text-transform: capitalize;
        }

        .subscription-btn {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: background 0.2s, transform 0.2s;
        }

        .subscription-btn:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        .back {
            display: block;
            margin-top: 18px;
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: #374151;
        }
    </style>
</head>

<body>
    <div class="con">

        <div class="icon">
            🔒
        </div>

        <h1>Subscription Required</h1>

        <p class="need-permission">
            You need at least
            <span class="tier">{{ tier }}</span>
            subscription to view this page.
        </p>

        <a class="subscription-btn" href="{% url 'subscriptions:plans' %}">
            View Subscription Plans →
        </a>

        <a class="back" href="javascript:history.back()">
            ← Go back
        </a>

    </div>
</body>
</html>
