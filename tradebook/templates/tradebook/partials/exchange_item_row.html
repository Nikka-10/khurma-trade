<div class="item-row">
    {% for hidden in form.hidden_fields %}{{ hidden }}{% endfor %}
    <div class="item-picker">
        <input type="text" class="item-search" name="q" placeholder="Search for an item..." aria-label="Item search" autocomplete="off" value="{{ form.item_label }}" hx-get="{% url 'tradebook:search_items' %}" hx-trigger="keyup changed delay:300ms" hx-target="#results-{{ form.prefix }}" hx-include="#exchange-filters">
        <div class="item-results" id="results-{{ form.prefix }}"></div>
    </div>
    {{ form.quantity }}
    {% if removable %}<button type="button" class="item-remove" onclick="removeExchangeRow(this)" aria-label="Remove item">×</button>{% endif %}
    <div class="item-row-errors">{{ form.item.errors }}{{ form.quantity.errors }}</div>
</div>
