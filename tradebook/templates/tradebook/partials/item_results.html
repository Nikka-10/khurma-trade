{% for item in items %}
<div class="search-result-item" role="button" tabindex="0" data-item-id="{{ item.id }}" data-item-name="{{ item.name_on_market }}" onclick="selectItemFromResult(this)" onkeydown="if(event.key === 'Enter' || event.key === ' '){event.preventDefault();selectItemFromResult(this)}">{{ item.name_on_market }}</div>
{% empty %}
{% if request.GET.q %}<div class="search-empty">No matching items found.</div>{% endif %}
{% endfor %}
