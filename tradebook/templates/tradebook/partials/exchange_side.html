{{ formset.management_form }}
{{ formset.non_form_errors }}
<div id="{{ side }}-rows" class="exchange-items-list">
    {% for form in formset %}{% include 'tradebook/partials/exchange_item_row.html' with form=form removable=forloop.counter0 %}{% endfor %}
</div>
<template id="{{ side }}-empty-row">{% include 'tradebook/partials/exchange_item_row.html' with form=formset.empty_form removable=True %}</template>
<button type="button" class="add-item-button" onclick="addRow('{{ side }}')">+ Add item</button>
