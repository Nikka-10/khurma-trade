{{ formset.management_form }}
{{ formset.non_form_errors }}

<div id="{{ side }}-rows">
    {% for form in formset %}
        {% include 'tradebook/partials/exchange_item_row.html' with form=form removable=forloop.counter0 %}
    {% endfor %}
</div>

{# blueprint for "+ Add item"; <template> content is inert until JS clones it #}
<template id="{{ side }}-empty-row">
    {% include 'tradebook/partials/exchange_item_row.html' with form=formset.empty_form removable=True %}
</template>

<button type="button" class="btn" onclick="addRow('{{ side }}')">+ Add item</button>
